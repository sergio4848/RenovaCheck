# Job structure and hardening adapted from careos/.github/workflows/ci.yml and
# konstela/.github/workflows/ci.yml — Copyright (c) 2026 Sergen Şahin.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web · Pint, migrations, PHPUnit (PostgreSQL + RLS)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_PASSWORD: postgres-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Not production: the event-log migration refuses to roll back in production.
      APP_ENV: ci
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: renova
      DB_USERNAME: renova_app
      DB_PASSWORD: app-ci
      DB_APP_ROLE: renova_app
      DB_MIGRATOR_USERNAME: renova_owner
      DB_MIGRATOR_PASSWORD: owner-ci
      APP_KEY: base64:2fl+Ktvkfl+Fuz4Qp/A75G2RTiWVA/ZoKZvp6fiiM10=
      DEMO_USER_PASSWORD: ci-demo-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60 # 2.40.0
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, intl, zip, bcmath
          coverage: none
      - name: Bootstrap database roles
        working-directory: infra/postgres
        env:
          PGPASSWORD: postgres-ci
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -v owner_pw=owner-ci -v app_pw=app-ci -f bootstrap.sql
          # Idempotency: a second run must succeed unchanged.
          psql -q -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -v owner_pw=owner-ci -v app_pw=app-ci -f bootstrap.sql
      - name: Install dependencies
        # Configuration comes from the job environment; an empty .env keeps dotenv quiet.
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          touch .env
      - name: Security advisories (fails on any known vulnerability in composer.lock)
        run: composer audit --locked --no-interaction
      - name: Pint
        run: vendor/bin/pint --test
      - name: Migrations apply, roll back and re-apply
        run: |
          php artisan migrate --database=migrator --force
          php artisan migrate:rollback --database=migrator --force
          php artisan migrate --database=migrator --force
      - name: Seed demo data twice (idempotent)
        run: |
          php artisan db:seed --database=migrator --force
          php artisan db:seed --database=migrator --force
      - name: Tests
        env:
          DB_USERNAME: renova_owner
          DB_PASSWORD: owner-ci
        run: php artisan test

  extract:
    name: Extract · Ruff, mypy, pytest
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/extract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/extract/pyproject.toml
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-pol
          pip install -e ".[dev]"
      - name: Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy
      - name: Tests
        run: pytest -q

  synth:
    name: Synth · Ruff, mypy, pytest, dataset validation
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/synth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/synth/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy
      - name: Tests
        run: pytest -q
      - name: Generate and validate 20 cases
        run: renova-synth generate --out ../../data/synth --cases 20 --seed 2026

  stack:
    name: Stack · make up && make test
    runs-on: ubuntu-24.04
    needs: [web, extract, synth]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start stack
        run: make up
      - name: Smoke
        run: |
          curl -fsS http://127.0.0.1:8080/up
          curl -fsS http://127.0.0.1:8001/ready
          curl -fsS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8080/login | grep -q 200
      - name: Tests in containers
        run: make test
      - name: Synthetic dataset
        run: make synth
      - name: Evaluation report (fails below the thresholds; short OCR benchmark)
        run: make eval OCR_BENCH_PAGES=20
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
