program: czyste_powietrze
edition: "2025-03-31"
family: amount
valid_from: 2025-03-31
valid_to: null
severity: warning
inputs:
  doc_types: [umowa, oferta, aneks, faktura]
  fields: [amount_net, amount_gross]
comparator: invoice_total
threshold:
  min_confidence: 0.5
  tolerance_pln: 0.01
emits:
  - outcome: discrepancy
