notes: >-
  Kwota brutto faktury końcowej porównywana z umową lub ofertą (po aneksie: z aneksem). Rozpoznaje wpisanie kwoty brutto jako netto. Wynik zawsze do sprawdzenia. Do weryfikacji z dokumentami programu (regulamin i załączniki edycji od 31.03.2025), które nie były dostępne przy tworzeniu reguły.
