id: AMT-02
version: 1
title_pl: "Rozliczenie zaliczki na fakturze końcowej"
program: czyste_powietrze
edition: "2025-03-31"
family: amount
valid_from: 2025-03-31
valid_to: null
severity: warning
inputs:
  doc_types: [faktura, faktura_zaliczkowa]
  fields: [advance_amount, amount_due, amount_gross]
comparator: advance_settlement
threshold:
  min_confidence: 0.5
  tolerance_pln: 0.01
emits:
  - outcome: explained_by_advance
    fields: [amount_due, advance_amount]
  - outcome: discrepancy
    fields: [advance_amount, amount_due]
source_url: https://czystepowietrze.gov.pl/
notes: >-
  Faktura końcowa pomniejszona o zaliczkę jest poprawna, gdy zaliczka odpowiada fakturze zaliczkowej, a kwota do zapłaty to brutto minus zaliczka. Wynik zawsze do sprawdzenia. Do weryfikacji z dokumentami programu (regulamin i załączniki edycji od 31.03.2025), które nie były dostępne przy tworzeniu reguły.
